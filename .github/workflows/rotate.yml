name: Rotate secret

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target id from targets.json, e.g. aveiro/supabase-secret"
        required: true
      dry_run:
        description: "Plan only: read Vercel, change nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rotate-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every run waits for approval on the "rotation" environment (main branch only).
    environment: rotation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rotate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          INCOMING_SECRET: ${{ secrets.INCOMING_SECRET }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          TARGET: ${{ inputs.target }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/rotate.mjs "$TARGET" $([ "$DRY_RUN" = "true" ] && echo --dry-run)
